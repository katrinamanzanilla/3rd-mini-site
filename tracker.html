<section class="page-header">
  <h1>Issue Tracker</h1>
  <p>Monitor, manage, and resolve reported project issues</p>
</section>

<section class="container">
  <div class="table-wrap">
    <table>
      <tr>
        <th>Issue</th>
        <th>Project</th>
        <th>Status</th>
        <th>Owner</th>
      </tr>

      <tr>
        <td>Delayed approval</td>
        <td>System Upgrade</td>
        <td><span class="status open">Open</span></td>
        <td>PMO</td>
      </tr>

      <tr>
        <td>Missing document</td>
        <td>Onboarding</td>
        <td><span class="status progress">In Progress</span></td>
        <td>Admin</td>
      </tr>

      <tr>
        <td>Incorrect data entry</td>
        <td>Migration</td>
        <td><span class="status closed">Resolved</span></td>
        <td>IT Team</td>
      </tr>
    </table>
  </div>
</section>
